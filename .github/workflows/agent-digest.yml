# Generated by harness. Weekly summary of agent activity, posted as an issue.
name: Agent digest

on:
  schedule:
    - cron: "43 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Build digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          fields=number,title,labels,additions,deletions,mergedAt,closedAt,state
          gh pr list -R "$REPO" --state all --search "updated:>=$since" --limit 500 --json "$fields" > prs.json
          jq -r --arg since "$since" '
            def agent: any(.labels[]; .name == "agent-authored");
            def recent($f): (.[$f] // "") >= $since;
            [.[] | select(agent)] as $a
            | [$a[] | select(.state == "MERGED" and recent("mergedAt"))] as $m
            | [$a[] | select(.state == "CLOSED" and recent("closedAt"))] as $c
            | [.[] | select(.state == "MERGED" and recent("mergedAt") and (.title | test("^Revert"; "i")))] as $rv
            | [.[] | select(.state == "MERGED" and recent("mergedAt"))] as $all
            | "## Agent activity since \($since)\n\n"
            + "| Metric | Value |\n|---|---|\n"
            + "| Agent PRs merged | \($m | length) of \($all | length) merged PRs |\n"
            + "| Agent PRs closed without merge | \($c | length) |\n"
            + "| Agent PRs still open | \([$a[] | select(.state == "OPEN")] | length) |\n"
            + "| Lines changed by merged agent PRs | \([$m[] | .additions + .deletions] | add // 0) |\n"
            + "| Reverts merged (all authors) | \($rv | length) |\n\n"
            + (if ($m | length) > 0 then "### Merged agent PRs\n" + ([$m[] | "- #\(.number) \(.title)"] | join("\n")) + "\n" else "" end)
          ' prs.json > digest.md
      - name: Gate scores and AI-review feedback
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : > scorecards.jsonl
          : > review-comments.jsonl
          for n in $(jq -r '.[:100][].number' prs.json); do
            gh api --paginate "repos/$REPO/issues/$n/comments" \
              --jq '.[] | .body | select(contains("<!-- harness-scorecard")) | capture("<!-- harness-scorecard (?<j>\\{.*\\}) -->").j' \
              2>/dev/null | tail -n 1 >> scorecards.jsonl || true
            gh api --paginate "repos/$REPO/pulls/$n/comments" \
              --jq '.[] | select(.body | contains("<!-- harness-review:")) | {down: .reactions["-1"], m: (.body | capture("<!-- harness-review:(?<j>\\{.*\\}) -->").j | fromjson)} | {pattern: .m.pattern, cat: .m.cat, sev: .m.sev, down}' \
              2>/dev/null >> review-comments.jsonl || true
          done
          jq -rs '
            if length == 0 then "" else
              . as $s
              | def avg(f): if length == 0 then "n/a" else ((map(f) | add) / length * 10 | round / 10 | tostring) end;
              "### PR gate\n\n| | Agent PRs | Human PRs |\n|---|---|---|\n"
              + "| PRs scored | \([$s[] | select(.agent)] | length) | \([$s[] | select(.agent | not)] | length) |\n"
              + "| Average score | \([$s[] | select(.agent)] | avg(.score)) | \([$s[] | select(.agent | not)] | avg(.score)) |\n"
              + "| Currently failing | \([$s[] | select(.agent and .verdict == "fail")] | length) | \([$s[] | select((.agent | not) and .verdict == "fail")] | length) |\n"
              + "| Overrides (`gate-override`) | \([$s[] | select(.agent and .override)] | length) | \([$s[] | select((.agent | not) and .override)] | length) |\n\n"
            end' scorecards.jsonl >> digest.md
          jq -rs '
            if length == 0 then "" else
              group_by(.pattern) | map({pattern: .[0].pattern, cat: .[0].cat, posted: length, dismissed: ([.[] | select(.down > 0)] | length)})
              | sort_by(-.dismissed, -.posted) | .[:10]
              | "### AI review: findings by pattern\n\nA 👎 counts as a dismissal. Patterns with high dismissal rates are candidates for sharper criteria, or for switching their category off in `.github/review/criteria.md`.\n\n| Pattern | Category | Posted | Dismissed (👎) |\n|---|---|---|---|\n"
                + (map("| `\(.pattern)` | \(.cat) | \(.posted) | \(.dismissed) |") | join("\n")) + "\n"
            end' review-comments.jsonl >> digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create agent-digest --color c5def5 2>/dev/null -R "$REPO" || true
          gh issue create -R "$REPO" --title "Agent digest: week of $(date -u +%Y-%m-%d)" \
            --label agent-digest --body-file digest.md
