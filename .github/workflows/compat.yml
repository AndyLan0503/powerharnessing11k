# Hand-written (not generated by harness): harness must run on stock macOS,
# i.e. bash 3.2 and BSD awk/sed, and on Windows in Git Bash. ci.yml covers
# Linux.
name: Compatibility

# Only changes to shell code (the engine, the templates whose hooks run on
# users' machines, and the tests) can break these platforms; docs-only
# changes skip these slow jobs. If one becomes a required check, replace the
# path filters with a job that always starts and exits early, or such PRs
# will wait for it forever.
on:
  pull_request:
    paths: # keep in sync with push.paths
      - 'bin/**'
      - 'lib/**'
      - 'modules/**'
      - 'agents/**'
      - 'profiles/**'
      - 'tests/**'
      - 'setup.sh'
      - 'Makefile'
      - '.github/workflows/compat.yml'
      - '.gitattributes'
  # The full Windows suite, which PRs only sample (see the windows job).
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'modules/**'
      - 'agents/**'
      - 'profiles/**'
      - 'tests/**'
      - 'setup.sh'
      - 'Makefile'
      - '.github/workflows/compat.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  bash32:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Force stock bash 3.2 and BSD awk
        run: |
          mkdir -p "$RUNNER_TEMP/stock"
          ln -s /bin/bash "$RUNNER_TEMP/stock/bash"
          ln -s /usr/bin/awk "$RUNNER_TEMP/stock/awk"
          echo "$RUNNER_TEMP/stock" >> "$GITHUB_PATH"
      - run: bash --version | head -1 && awk --version | head -1
      - run: tests/run.sh

  windows:
    name: Windows (Git Bash)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # Check out the way Git for Windows does on a user's machine (CRLF by
      # default): .gitattributes must keep the tool's scripts on LF.
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - run: bash --version | head -1 && git --version
      # Every process start is slow in Git Bash, so a PR runs the tests that
      # exercise Windows-specific behaviour (links, line endings, the hooks
      # with and without jq, each agent's adapter); main, the nightly run,
      # and a manual run get the whole suite.
      - name: Tests
        env:
          EVENT: ${{ github.event_name }}
          SMOKE: >-
            test_windows_checkouts test_render_engine test_guard_hooks
            test_collaborator_needs_nothing test_codex_adapter
            test_copilot_adapter test_single_source_of_truth test_stop_checks
        run: |
          if [ "$EVENT" = pull_request ]; then tests/run.sh "$SMOKE"; else tests/run.sh; fi
