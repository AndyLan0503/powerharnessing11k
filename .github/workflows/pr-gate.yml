#
# One required check for every PR: make "PR gate / gate" (and CI) required in
# branch protection. Jobs:
#   guard   detects agent-authored PRs, labels them, flags risky diff patterns
#   gate    combines the signals into pass/fail and a scorecard comment;
#           a maintainer's `gate-override` label accepts the risk on record
#
# Every job runs its scripts (and the review criteria) from the BASE branch, so
# a PR cannot weaken the checks that judge it. Protect .github/ with CODEOWNERS.
name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Label/title edits get their own group so they never cancel a running review.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["labeled","unlabeled","edited"]'), github.event.action) && 'meta' || 'code' }}
  cancel-in-progress: true

env:
  # Pin to a version you have tested, e.g. 2.1.0; "latest" tracks new releases.
  CLAUDE_CODE_VERSION: latest

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.guard.outputs.agent }}
      reason: ${{ steps.guard.outputs.reason }}
      blocking: ${{ steps.guard.outputs.blocking }}
      block_count: ${{ steps.guard.outputs.block_count }}
      warn_count: ${{ steps.guard.outputs.warn_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base branch's guard script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:.github/scripts/agent-guard.sh" >"$RUNNER_TEMP/agent-guard.sh" 2>/dev/null ||
            cp .github/scripts/agent-guard.sh "$RUNNER_TEMP/agent-guard.sh"
      - name: Inspect diff
        id: guard
        run: bash "$RUNNER_TEMP/agent-guard.sh"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GUARD_MODE: warn
          DIFF_BUDGET: "800"
      - name: Label agent-authored PR
        if: steps.guard.outputs.agent == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create agent-authored --color 7057ff \
            --description "Written by a coding agent; reviewed by a human" 2>/dev/null || true
          gh pr edit "$PR" --add-label agent-authored

  gate:
    needs: [guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base branch's gate script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:.github/scripts/pr-gate.sh" >"$RUNNER_TEMP/pr-gate.sh" 2>/dev/null ||
            cp .github/scripts/pr-gate.sh "$RUNNER_TEMP/pr-gate.sh"
      - name: Gate and scorecard
        run: bash "$RUNNER_TEMP/pr-gate.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GUARD_ENABLED: "1"
          GUARD_RESULT: ${{ needs.guard.result }}
          GUARD_AGENT: ${{ needs.guard.outputs.agent }}
          GUARD_REASON: ${{ needs.guard.outputs.reason }}
          GUARD_BLOCKING: ${{ needs.guard.outputs.blocking }}
          GUARD_BLOCK_COUNT: ${{ needs.guard.outputs.block_count }}
          GUARD_WARN_COUNT: ${{ needs.guard.outputs.warn_count }}
