# Generated by harness. Detects agent-authored PRs, labels them, and checks
# for the failure modes agents are most prone to.
name: Agent guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect diff
        id: guard
        run: .github/scripts/agent-guard.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GUARD_MODE: {{AGENT_GUARD_MODE}}
          DIFF_BUDGET: "{{DIFF_BUDGET}}"
      - name: Label agent-authored PR
        if: steps.guard.outputs.agent == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create agent-authored --color 7057ff \
            --description "Written by a coding agent; reviewed by a human" 2>/dev/null || true
          gh pr edit "$PR" --add-label agent-authored
      - name: Enforce
        if: steps.guard.outputs.blocking == 'true'
        run: |
          echo "::error::Agent guard found blocking issues. See the job summary."
          exit 1
