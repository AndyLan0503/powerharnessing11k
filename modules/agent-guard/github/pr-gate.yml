# Generated by harness; maintainers regenerate it from .harness/config (see .harness/README.md).
#
# One required check for every PR: make "PR gate / gate" (and CI) required in
# branch protection. Jobs:
{{#if MOD_AGENT_GUARD}}
#   guard   detects agent-authored PRs, labels them, flags risky diff patterns
{{/if}}
{{#if MOD_REVIEW}}
#   review  independent Claude Code review (claude -p, JSON-schema findings)
{{/if}}
#   gate    combines the signals into pass/fail and a scorecard comment;
#           a maintainer's `gate-override` label accepts the risk on record
name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
{{#if MOD_AGENT_GUARD}}
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.guard.outputs.agent }}
      reason: ${{ steps.guard.outputs.reason }}
      blocking: ${{ steps.guard.outputs.blocking }}
      block_count: ${{ steps.guard.outputs.block_count }}
      warn_count: ${{ steps.guard.outputs.warn_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect diff
        id: guard
        run: .github/scripts/agent-guard.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GUARD_MODE: {{AGENT_GUARD_MODE}}
          DIFF_BUDGET: "{{DIFF_BUDGET}}"
      - name: Label agent-authored PR
        if: steps.guard.outputs.agent == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create agent-authored --color 7057ff \
            --description "Written by a coding agent; reviewed by a human" 2>/dev/null || true
          gh pr edit "$PR" --add-label agent-authored
{{/if}}
{{#if MOD_REVIEW}}

  review:
    # Label and description edits re-run the gate, not the (paid) review.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["labeled","unlabeled","edited"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.review.outputs.status }}
      blocking: ${{ steps.review.outputs.blocking }}
      nits: ${{ steps.review.outputs.nits }}
      preexisting: ${{ steps.review.outputs.preexisting }}
      patterns: ${{ steps.review.outputs.patterns }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: AI review
        id: review
        run: .github/scripts/ai-review.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Keep findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-findings
          path: .harness-review/
          retention-days: 30
          if-no-files-found: ignore
{{/if}}

  gate:
    needs: [{{GATE_NEEDS}}]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gate and scorecard
        run: .github/scripts/pr-gate.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
{{#if MOD_AGENT_GUARD}}
          GUARD_ENABLED: "1"
          GUARD_AGENT: ${{ needs.guard.outputs.agent }}
          GUARD_REASON: ${{ needs.guard.outputs.reason }}
          GUARD_BLOCKING: ${{ needs.guard.outputs.blocking }}
          GUARD_BLOCK_COUNT: ${{ needs.guard.outputs.block_count }}
          GUARD_WARN_COUNT: ${{ needs.guard.outputs.warn_count }}
{{/if}}
{{#if MOD_REVIEW}}
          REVIEW_ENABLED: "1"
          REVIEW_STATUS: ${{ needs.review.outputs.status }}
          REVIEW_BLOCKING: ${{ needs.review.outputs.blocking }}
          REVIEW_NITS: ${{ needs.review.outputs.nits }}
          REVIEW_PREEXISTING: ${{ needs.review.outputs.preexisting }}
          REVIEW_PATTERNS: ${{ needs.review.outputs.patterns }}
{{/if}}
