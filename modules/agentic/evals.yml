# Runs the eval suite when prompts, evals, or agent code change. Evals call
# real models: add the provider key as a repository secret.
name: Evals

on:
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "src/**"
      - "app/**"
      - "agents/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    # Secrets are unavailable to fork PRs; skip instead of failing.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
{{#if STACK_NODE}}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
{{/if}}
{{#if STACK_PYTHON}}
{{#if PM_UV}}
      - uses: astral-sh/setup-uv@v6
{{/if}}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
{{/if}}
{{#if INSTALL_CMD}}
      - name: Install
        run: |
          {{INSTALL_CMD}}
{{/if}}
      - name: Run evals
        run: |
          {{EVAL_CMD}}
