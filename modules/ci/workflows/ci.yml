# Generated by harness; maintainers regenerate it from .harness/config (see .harness/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [{{DEFAULT_BRANCH}}]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
{{#if STACK_NODE}}
{{#if PM_PNPM}}
      - uses: pnpm/action-setup@v4
{{/if}}
{{#if PM_BUN}}
      - uses: oven-sh/setup-bun@v2
{{/if}}
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
{{#unless PM_BUN}}
          cache: {{PKG_MANAGER}}
{{/if}}
{{/if}}
{{#if STACK_PYTHON}}
{{#if PM_UV}}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
{{/if}}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
{{#if PM_POETRY}}
      - run: pipx install poetry
{{/if}}
{{/if}}
{{#if STACK_GO}}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
{{/if}}
{{#if STACK_RUST}}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
{{/if}}
{{#if INSTALL_CMD}}
      - name: Install
        run: |
          {{INSTALL_CMD}}
{{/if}}
{{#if LINT_CMD}}
      - name: Lint
        run: |
          {{LINT_CMD}}
{{/if}}
{{#if TYPECHECK_CMD}}
      - name: Typecheck
        run: |
          {{TYPECHECK_CMD}}
{{/if}}
{{#if TEST_CMD}}
      - name: Test
        run: |
          {{TEST_CMD}}
{{/if}}
{{#unless HAS_COMMANDS}}
      - name: Configure me
        run: echo "No commands configured. Set LINT_CMD/TEST_CMD in .harness/config and regenerate; see .harness/README.md."
{{/if}}
