name: CI

on:
  pull_request:
  push:
    branches: [{{DEFAULT_BRANCH}}]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
{{> workflows/toolchain.yml.part}}
{{#if LINT_CMD}}
      - name: Lint
        run: |
{{#if USE_MAKE}}
          make lint
{{/if}}
{{#unless USE_MAKE}}
          {{LINT_CMD}}
{{/if}}
{{/if}}
{{#if TYPECHECK_CMD}}
      - name: Typecheck
        run: |
{{#if USE_MAKE}}
          make typecheck
{{/if}}
{{#unless USE_MAKE}}
          {{TYPECHECK_CMD}}
{{/if}}
{{/if}}
{{#if TEST_CMD}}
      - name: Test
        run: |
{{#if USE_MAKE}}
          make test
{{/if}}
{{#unless USE_MAKE}}
          {{TEST_CMD}}
{{/if}}
{{/if}}
{{#unless HAS_COMMANDS}}
      - name: Configure me
        run: |
          echo "TODO(team): no lint/test commands configured yet; add them to this workflow."
{{/if}}
