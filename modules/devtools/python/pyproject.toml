[project]
name = "{{PY_DIST}}"
version = "0.1.0"
description = "TODO(team): one line"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{PY_PACKAGE}}"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["{{PY_PACKAGE}}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
markers = [
    "integration: crosses a module, file, process, or service boundary",
    "regression: compares outputs against recorded golden results",
    "slow: takes more than a few seconds; excluded from the fast tier",
    "benchmark: measures runtime or quality budgets; excluded from the fast tier",
]

[tool.coverage.run]
source = ["src"]
branch = true
