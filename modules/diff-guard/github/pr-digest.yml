# Weekly summary of pull-request outcomes and gate results, posted as an issue.
name: PR digest

on:
  schedule:
    - cron: "43 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Build digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          fields=number,title,labels,additions,deletions,mergedAt,closedAt,state
          gh pr list -R "$REPO" --state all --search "updated:>=$since" --limit 500 --json "$fields" > prs.json
          jq -r --arg since "$since" '
            def recent($f): (.[$f] // "") >= $since;
            [.[] | select(.state == "MERGED" and recent("mergedAt"))] as $m
            | [.[] | select(.state == "CLOSED" and recent("closedAt"))] as $c
            | [$m[] | select(.title | test("^Revert"; "i"))] as $rv
            | "## Pull requests since \($since)\n\n"
            + "| Metric | Value |\n|---|---|\n"
            + "| Merged | \($m | length) |\n"
            + "| Closed without merge | \($c | length) |\n"
            + "| Still open | \([.[] | select(.state == "OPEN")] | length) |\n"
            + "| Lines changed by merged PRs | \([$m[] | .additions + .deletions] | add // 0) |\n"
            + "| Reverts merged | \($rv | length) |\n\n"
          ' prs.json > digest.md
      - name: Gate scores and AI-review feedback
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : > scorecards.jsonl
          : > review-comments.jsonl
          for n in $(jq -r '.[:100][].number' prs.json); do
            gh api --paginate "repos/$REPO/issues/$n/comments" \
              --jq '.[] | select(.user.type == "Bot") | .body | select(contains("<!-- pr-gate-scorecard")) | capture("<!-- pr-gate-scorecard (?<j>\\{.*\\}) -->").j | fromjson? // empty | tojson' \
              2>/dev/null | tail -n 1 >> scorecards.jsonl || true
            gh api --paginate "repos/$REPO/pulls/$n/comments" \
              --jq '.[] | select(.user.type == "Bot" and (.body | contains("<!-- ai-review:"))) | {down: (.reactions["-1"] // 0), m: (.body | capture("<!-- ai-review:(?<j>\\{[^\\n]*\\}) -->").j | fromjson? // {})} | {pattern: (.m.pattern // "unknown" | tostring | gsub("[^a-z0-9-]"; "")), cat: (.m.cat // "" | tostring | gsub("[^a-z0-9-]"; "")), down} | tojson' \
              2>/dev/null >> review-comments.jsonl || true
          done
          jq -R 'fromjson? // empty' scorecards.jsonl | jq -rs '
            if length == 0 then "" else
              . as $s
              | def avg(f): if length == 0 then "n/a" else ((map(f) | add) / length * 10 | round / 10 | tostring) end;
              "### PR gate\n\n| Metric | Value |\n|---|---|\n"
              + "| PRs scored | \($s | length) |\n"
              + "| Average score | \($s | avg(.score)) |\n"
              + "| Currently failing | \([$s[] | select(.verdict == "fail")] | length) |\n"
              + "| Diff-guard blocking-class findings | \([$s[] | .guard.block // 0] | add // 0) |\n"
              + "| Diff-guard warnings | \([$s[] | .guard.warn // 0] | add // 0) |\n"
              + "| Overrides (`gate-override`) | \([$s[] | select(.override)] | length) |\n\n"
            end' >> digest.md
          jq -R 'fromjson? // empty' review-comments.jsonl | jq -rs '
            if length == 0 then "" else
              group_by(.pattern) | map({pattern: .[0].pattern, cat: .[0].cat, posted: length, dismissed: ([.[] | select(.down > 0)] | length)})
              | sort_by(-.dismissed, -.posted) | .[:10]
              | "### AI review: findings by pattern\n\nA 👎 counts as a dismissal. Patterns with high dismissal rates are candidates for sharper criteria, or for switching their category off in `scripts/ci/review/criteria.md`.\n\n| Pattern | Category | Posted | Dismissed (👎) |\n|---|---|---|---|\n"
                + (map("| `\(.pattern)` | \(.cat) | \(.posted) | \(.dismissed) |") | join("\n")) + "\n"
            end' >> digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create pr-digest --color c5def5 2>/dev/null -R "$REPO" || true
          gh issue create -R "$REPO" --title "PR digest: week of $(date -u +%Y-%m-%d)" \
            --label pr-digest --body-file digest.md
