#
# One required check for every PR: make "PR gate / gate" (and CI) required in
# branch protection. Jobs:
{{#if MOD_DIFF_GUARD}}
#   guard   flags risky diff patterns (weakened tests, protected paths, size)
{{/if}}
{{#if MOD_REVIEW}}
#   review  independent Claude Code review (claude -p, JSON-schema findings)
{{/if}}
#   gate    combines the signals into pass/fail and a scorecard comment;
#           a maintainer's `gate-override` label accepts the risk on record
#
# Every job runs its scripts (and the review criteria) from the BASE branch, so
# a PR cannot weaken the checks that judge it. Protect .github/ with CODEOWNERS.
name: PR gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Label/title edits get their own group so they never cancel a running review.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["labeled","unlabeled","edited"]'), github.event.action) && 'meta' || 'code' }}
  cancel-in-progress: true

env:
  # Pin to a version you have tested, e.g. 2.1.0; "latest" tracks new releases.
  CLAUDE_CODE_VERSION: latest

jobs:
{{#if MOD_DIFF_GUARD}}
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      blocking: ${{ steps.guard.outputs.blocking }}
      block_count: ${{ steps.guard.outputs.block_count }}
      warn_count: ${{ steps.guard.outputs.warn_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base branch's guard script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:scripts/ci/diff-guard.sh" >"$RUNNER_TEMP/diff-guard.sh" 2>/dev/null ||
            cp scripts/ci/diff-guard.sh "$RUNNER_TEMP/diff-guard.sh"
      - name: Inspect diff
        id: guard
        run: bash "$RUNNER_TEMP/diff-guard.sh"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GUARD_MODE: {{DIFF_GUARD_MODE}}
          DIFF_BUDGET: "{{DIFF_BUDGET}}"
{{/if}}
{{#if MOD_REVIEW}}

  review:
    # Label and description edits re-run the gate, not the (paid) review.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(fromJSON('["labeled","unlabeled","edited"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.review.outputs.status }}
      blocking: ${{ steps.review.outputs.blocking }}
      nits: ${{ steps.review.outputs.nits }}
      preexisting: ${{ steps.review.outputs.preexisting }}
      failed: ${{ steps.review.outputs.failed_passes }}
      patterns: ${{ steps.review.outputs.patterns }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base branch's review script and criteria
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          for f in scripts/ci/ai-review.sh scripts/ci/review/criteria.md scripts/ci/review/findings.schema.json; do
            git show "$BASE_SHA:$f" >"$RUNNER_TEMP/$(basename "$f")" 2>/dev/null || cp "$f" "$RUNNER_TEMP/$(basename "$f")"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: AI review
        id: review
        run: bash "$RUNNER_TEMP/ai-review.sh"
        env:
          CRITERIA_FILE: ${{ runner.temp }}/criteria.md
          SCHEMA_FILE: ${{ runner.temp }}/findings.schema.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Keep findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-findings
          path: .ai-review/
          retention-days: 30
          if-no-files-found: ignore
{{/if}}

  gate:
    needs: [{{GATE_NEEDS}}]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the base branch's gate script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:scripts/ci/pr-gate.sh" >"$RUNNER_TEMP/pr-gate.sh" 2>/dev/null ||
            cp scripts/ci/pr-gate.sh "$RUNNER_TEMP/pr-gate.sh"
      - name: Gate and scorecard
        run: bash "$RUNNER_TEMP/pr-gate.sh"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
{{#if MOD_DIFF_GUARD}}
          GUARD_ENABLED: "1"
          GUARD_RESULT: ${{ needs.guard.result }}
          GUARD_BLOCKING: ${{ needs.guard.outputs.blocking }}
          GUARD_BLOCK_COUNT: ${{ needs.guard.outputs.block_count }}
          GUARD_WARN_COUNT: ${{ needs.guard.outputs.warn_count }}
{{/if}}
{{#if MOD_REVIEW}}
          REVIEW_ENABLED: "1"
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_EXPECTED: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
          REVIEW_FAILED: ${{ needs.review.outputs.failed }}
          REVIEW_STATUS: ${{ needs.review.outputs.status }}
          REVIEW_BLOCKING: ${{ needs.review.outputs.blocking }}
          REVIEW_NITS: ${{ needs.review.outputs.nits }}
          REVIEW_PREEXISTING: ${{ needs.review.outputs.preexisting }}
          REVIEW_PATTERNS: ${{ needs.review.outputs.patterns }}
{{/if}}
