# Fails PRs that add dependencies with known vulnerabilities. Needs the
# dependency graph: on by default for public repositories; private ones need
# GitHub Advanced Security (see the `enabled` job).
name: Dependency review

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  # Dependency review on a private repository needs GitHub Advanced Security. Without
  # it this check would fail on every run, so private repositories skip it
  # until a maintainer sets the repository variable ADVANCED_SECURITY to
  # "true" (Settings, Secrets and variables, Actions, Variables). If the
  # visibility cannot be read, it skips too. A skipped job still satisfies a
  # required check.
  enabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          OPT_IN: ${{ vars.ADVANCED_SECURITY }}
        run: |
          export GH_HOST=${GITHUB_SERVER_URL#*://}
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private) || private=
          if [ "$OPT_IN" = true ] || [ "$private" = false ]; then
            echo run=true >>"$GITHUB_OUTPUT"
          elif [ -z "$private" ]; then
            echo "::notice::Skipped: could not read the repository's visibility"
          else
            echo "::notice::Skipped: private repository without ADVANCED_SECURITY=true"
          fi

  review:
    needs: enabled
    if: needs.enabled.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
